<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#fff"/>
  <rect x="20" y="20" width="1160" height="720" rx="8" fill="#f7fafc" stroke="#111827" stroke-width="8"/>
  <text x="600" y="82" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="700">FIELD EVIDENCE REFERENCE CARD</text>
  <text x="600" y="122" text-anchor="middle" font-family="sans-serif" font-size="20">Print at 100% scale. Tap the four corners in order: TL, TR, BR, BL.</text>
  <g stroke="#111827" stroke-width="3">
    <rect x="110" y="190" width="210" height="150" fill="#f4f4f4"/><rect x="370" y="190" width="210" height="150" fill="#c8c8c8"/>
    <rect x="630" y="190" width="210" height="150" fill="#707070"/><rect x="890" y="190" width="210" height="150" fill="#202020"/>
    <rect x="110" y="410" width="210" height="150" fill="#d84b43"/><rect x="370" y="410" width="210" height="150" fill="#e2b52e"/>
    <rect x="630" y="410" width="210" height="150" fill="#42a85a"/><rect x="890" y="410" width="210" height="150" fill="#347ac1"/>
  </g>
  <g font-family="sans-serif" font-size="24" text-anchor="middle" fill="#111827">
    <text x="215" y="375">PATCH 1</text><text x="475" y="375">PATCH 2</text><text x="735" y="375">PATCH 3</text><text x="995" y="375">PATCH 4</text>
    <text x="215" y="595">PATCH 5</text><text x="475" y="595">PATCH 6</text><text x="735" y="595">PATCH 7</text><text x="995" y="595">PATCH 8</text>
  </g>
  <text x="600" y="680" text-anchor="middle" font-family="sans-serif" font-size="22">Keep the card flat, fully visible, and evenly lit beside the test strip.</text>
</svg>