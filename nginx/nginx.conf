# Optional production: one origin (UI + API). No CORS needed.
# docker run --rm -p 80:80 -v ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf \
#   -v ./FRONTEND/dist:/usr/share/nginx/html nginx:alpine
# Point FastAPI at backend:8000 on the Docker network.

server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
