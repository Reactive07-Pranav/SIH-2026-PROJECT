services:
  backend:
    build: ./BACKEND
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/drugdb
      - CORS_ORIGINS=http://localhost:5173
      - JWT_SECRET=${JWT_SECRET:-}  # empty = random per start; set in .env for stable tokens
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./FRONTEND
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=drugdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d drugdb"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
